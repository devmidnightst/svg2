<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <meta name="color-scheme" content="dark" />
  <title>Nocturne</title>
  <script async="async" src="https://www.googletagmanager.com/gtag/js?id=G-69T9E59SM7"></script>
  <script>//<![CDATA[
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-69T9E59SM7');
  //]]></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b0a14'/><circle cx='16' cy='16' r='9' fill='%23c9c1ff'/><circle cx='21' cy='14' r='8' fill='%230b0a14'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <style>/*<![CDATA[*/
    :root {
      --bg:        #05060d;
      --bg-2:      #0a0b14;
      --panel:     rgba(20, 22, 38, 0.55);
      --line:      rgba(200, 195, 230, 0.06);
      --line-2:    rgba(200, 195, 230, 0.11);
      --line-3:    rgba(200, 195, 230, 0.18);
      --fg:        #e8e5f4;
      --fg-2:      #a9a3c7;
      --fg-3:      #706b8f;
      --dim:       #3f3c5a;
      --accent:    #b8b0da;
      --accent-2:  #8a80b6;
      --ease:      cubic-bezier(0.22, 0.72, 0.14, 1);
      --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bg-aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      filter: blur(44px);
      background:
        radial-gradient(70% 60% at 22% 28%, rgba(184, 176, 218, 0.20), transparent 60%),
        radial-gradient(60% 55% at 78% 72%, rgba(110, 110, 230, 0.18), transparent 60%),
        radial-gradient(48% 42% at 50% 50%, rgba(190, 110, 210, 0.10), transparent 60%),
        var(--bg);
      animation: auroraDrift 48s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
    }

    @keyframes auroraDrift {
      0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      100% { transform: translate3d(-0.4%, 0.3%, 0) scale(1.02) rotate(0.6deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #bg-aurora { animation: none; }
    }

    .flex-center {
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }

    .home {
      position: relative;
      z-index: 10;
      width: min(520px, 90vw);
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 48px 0;
    }

    .logo-mark {
      width: 60px;
      height: 60px;
      filter: drop-shadow(0 6px 22px rgba(139, 128, 182, 0.35));
      animation: fadeUp 0.55s var(--ease) both;
    }

    .title {
      font-size: 60px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--fg);
      user-select: none;
      position: relative;
      animation: fadeUp 0.55s var(--ease) 0.05s both;
    }

    .title .tag {
      position: absolute;
      left: calc(100% + 0.3em);
      top: 0.34em;
      font-size: 0.28em;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
    }

    .desc {
      max-width: 460px;
      text-align: center;
      color: var(--fg-3);
      font-size: 14px;
      line-height: 1.6;
      animation: fadeUp 0.55s var(--ease) 0.1s both;
    }

    #sj-form {
      width: 100%;
      gap: 12px;
      animation: fadeUp 0.55s var(--ease) 0.14s both;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: var(--panel);
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      transition: border-color 0.25s var(--ease), background 0.25s var(--ease),
                  transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .search-wrap:focus-within {
      border-color: var(--line-3);
      background: rgba(22, 24, 42, 0.7);
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(139, 125, 212, 0.1);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--fg-3);
      transition: color 0.25s var(--ease);
    }

    .search-wrap:focus-within .search-icon { color: var(--fg); }

    #sj-address {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
    }

    #sj-address::placeholder { color: var(--fg-3); }

    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 11px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s var(--ease), color 0.2s var(--ease),
                  background 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      border: 1px solid transparent;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #14121f;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(139, 128, 182, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(139, 128, 182, 0.35);
    }

    .btn-ghost {
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--fg-2);
    }

    .btn-ghost:hover {
      border-color: var(--line-3);
      color: var(--fg);
      background: rgba(200, 195, 230, 0.04);
      transform: translateY(-1px);
    }

    .error-box {
      width: 100%;
      text-align: center;
    }

    #sj-error {
      color: #ff8f8f;
      font-size: 13px;
      white-space: pre-wrap;
    }

    #sj-error-code {
      font-size: 11px;
      color: var(--fg-3);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
      white-space: pre-wrap;
      margin-top: 6px;
    }

    footer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 24px 5vw;
      color: var(--fg-3);
      font-size: 12px;
    }

    footer .links { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    footer a { color: var(--fg-2); text-decoration: none; transition: color 0.2s var(--ease); }
    footer a:hover { color: var(--fg); }
    footer .copy { color: var(--dim); }

    #sj-frame-wrapper {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      z-index: 9999;
      background-color: var(--bg);
    }

    #sj-frame {
      border: none;
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
    }

    #sj-frame-url {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(8px);
      color: var(--fg-2);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      z-index: 10000;
      pointer-events: none;
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sj-frame-hint {
      position: absolute;
      top: 12px;
      right: 14px;
      color: var(--fg-3);
      font-size: 11px;
      z-index: 10000;
      pointer-events: none;
      user-select: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  /*]]>*/</style>
</head>
<body>

  <div id="bg-aurora"></div>

  <main class="home">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#0b0a14" />
      <circle cx="16" cy="16" r="9" fill="#c9c1ff" />
      <circle cx="21" cy="14" r="8" fill="#0b0a14" />
    </svg>

    <h1 class="title">Nocturne<span class="tag">SVG</span></h1>

    <p class="desc">
      A single-file interception proxy built on Scramjet. Enter a URL or search
      term to surf away — everything runs from this one page.
    </p>

    <form id="sj-form" class="flex-center">
      <input id="sj-search-engine" value="https://lite.duckduckgo.com/lite/?q=%s" type="hidden" />
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="7" cy="7" r="5" />
          <line x1="13" y1="13" x2="10.5" y2="10.5" />
        </svg>
        <input id="sj-address" type="text" placeholder="Search or enter URL" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" />
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Open Here</button>
        <button type="button" class="btn btn-ghost" id="open-new-tab">New Tab</button>
      </div>
    </form>

    <div class="error-box">
      <p id="sj-error"></p>
      <pre id="sj-error-code"></pre>
    </div>
  </main>

  <footer>
    <div class="links">
      <a href="https://github.com/MercuryWorkshop">Mercury Workshop</a>
      <a href="https://github.com/MercuryWorkshop/scramjet">Scramjet</a>
    </div>
    <span class="copy">Nocturne &#183; powered by Scramjet</span>
  </footer>

  <div id="sj-frame-wrapper">
    <p id="sj-frame-url"></p>
    <span id="sj-frame-hint">Ctrl + Shift + Z to exit</span>
    <iframe id="sj-frame"></iframe>
  </div>

  <script src="https://unpkg.com/@mercuryworkshop/scramjet@2.0.67-alpha.1/dist/scramjet.js"></script>
  <script src="https://unpkg.com/@mercuryworkshop/scramjet-controller@0.0.13/dist/controller.api.js"></script>
  <script src="https://unpkg.com/@mercuryworkshop/libcurl-transport@2.0.5/dist/index.js"></script>
  <script>//<![CDATA[
    "use strict";

    const BASE_PATH = location.pathname.replace(/\/[^\/]*$/, "/");

    const swAllowedHostnames = ["localhost", "127.0.0.1"];

    function search(input, template) {
      try { return new URL(input).toString(); } catch (err) {}
      try {
        const url = new URL("http://" + input);
        if (url.hostname.includes(".")) return url.toString();
      } catch (err) {}
      return template.replace("%s", encodeURIComponent(input));
    }

    async function registerSW() {
      if (!navigator.serviceWorker) {
        if (location.protocol !== "https:" && !swAllowedHostnames.includes(location.hostname))
          throw new Error("Service workers cannot be registered without https.");
        throw new Error("Your browser doesn't support service workers.");
      }
      await navigator.serviceWorker.register(BASE_PATH + "sw.js", {
        scope: BASE_PATH,
        updateViaCache: "none",
      });
    }

    const form = document.getElementById("sj-form");
    const address = document.getElementById("sj-address");
    const searchEngine = document.getElementById("sj-search-engine");
    const frameWrapper = document.getElementById("sj-frame-wrapper");
    const frameElement = document.getElementById("sj-frame");
    const frameUrl = document.getElementById("sj-frame-url");
    const error = document.getElementById("sj-error");
    const errorCode = document.getElementById("sj-error-code");

    document.addEventListener("keydown", function (ev) {
      if (ev.ctrlKey && ev.shiftKey && ev.code == "KeyZ") {
        if (frameWrapper) frameWrapper.style.display = "none";
      }
    });

    function showErrorScreen(msg, details) {
      frameWrapper.style.display = "none";
      error.textContent = msg;
      errorCode.textContent = details || "";
    }

    let controller = null;
    let frame = null;

    async function initController() {
      const { Controller, config } = window.$scramjetController;
      config.scramjetPath = location.origin + BASE_PATH + "scj/scj.js";
      config.wasmPath = location.origin + BASE_PATH + "scj/scj.wasm";
      config.injectPath = location.origin + BASE_PATH + "controller/controller.inject.js";
      config.prefix = BASE_PATH + "~sj/";

      const transport = new window.LibcurlTransport.LibcurlClient({
        wisp: "wss://nocturne.lol/wisp/",
      });

      controller = new Controller({
        serviceworker: navigator.serviceWorker.controller,
        transport,
      });
      await controller.wait();

      frame = controller.createFrame(frameElement);
      if (!frame) throw new Error("createFrame returned null — is the iframe element in the DOM?");
    }

    async function navigate(url) {
      if (!url.startsWith("http")) url = "https://" + url;
      if (!controller) await initController();
      await frame.go(url);
      frameWrapper.style.display = "flex";
    }

    function newTab() {
      if (address.value == "") { address.focus(); return; }
      const url = search(address.value, searchEngine.value);
      window.open(url, "_blank");
    }

    document.getElementById("open-new-tab").addEventListener("click", newTab);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (address.value == "") { address.focus(); return; }

      const url = search(address.value, searchEngine.value);

      try {
        await registerSW();
      } catch (err) {
        error.textContent = "Failed to register service worker.";
        errorCode.textContent = err.toString();
        throw err;
      }

      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) =>
          navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true })
        );
      }

      try {
        await navigate(url);
      } catch (err) {
        showErrorScreen(err.message, err.stack);
      }
    });

    const goto = new URL(location.href).searchParams.get("goto");
    if (goto) {
      history.replaceState(null, "", location.pathname);
      address.value = goto;
      registerSW()
        .then(() => {
          if (!navigator.serviceWorker.controller) {
            return new Promise((resolve) =>
              navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true })
            );
          }
        })
        .then(() => navigate(goto))
        .catch((err) => showErrorScreen(err.message, err.stack));
    }
  //]]></script>
</body>
</html>
